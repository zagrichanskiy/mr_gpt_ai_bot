name: Deploy latest image

on:
  repository_dispatch:
    types: [deploy-latest]

env:
  SERVICE_NAME: ${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy latest ${{ env.SERVICE_NAME }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} <<'EOF'
            set -e

            echo "Detecting docker-compose path for container $SERVICE_NAME..."
            SERVICE_NAME="${{ env.SERVICE_NAME }}"

            COMPOSE_FILE=$(docker inspect "$SERVICE_NAME" \
              | jq -r '.[0].Config.Labels["com.docker.compose.project.config_files"]' || true)

            if [ -z "$COMPOSE_FILE" ] || [ "$COMPOSE_FILE" = "null" ]; then
              echo "Error: Compose file label not found on container $SERVICE_NAME"
              exit 1
            fi

            echo "Resolved compose path: \$COMPOSE_FILE"

            echo "Pulling latest image from registry..."
            docker compose -f "$COMPOSE_FILE" pull "$SERVICE_NAME"

            echo "Recreating container from latest image..."
            docker compose -f "$COMPOSE_DIR/$COMPOSE_FILE" up -d --no-deps --force-recreate "$SERVICE_NAME"

            echo "Deployment completed."
          EOF
