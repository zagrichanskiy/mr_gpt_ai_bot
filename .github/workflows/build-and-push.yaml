name: Build and Push Docker Image

on:
  push:
    tags:
      - '*'  # trigger on every tag

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tags to push image to registry
        id: create_tags
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_COMMIT=$(git rev-parse HEAD)
          DEV_COMMIT=$(git ls-remote origin refs/heads/dev | cut -f1)

          echo "TAG=$TAG"
          echo "TAG_COMMIT=$TAG_COMMIT"
          echo "DEV_COMMIT=$DEV_COMMIT"

          if [ "$TAG_COMMIT" = "$DEV_COMMIT" ]; then
            # This is a latest tag in dev branch
            echo "latest_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
          fi

          echo "version_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ steps.create_tags.outputs.version_tag }}
            ${{ steps.create_tags.outputs.latest_tag }}
